server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API'deki en yüksek [RequestSizeLimit] 16 MB (spending-analysis ve expense
  # analyze-statement). Bu değer onun üzerinde kalmalı, aksi halde kullanıcıya
  # vaat edilen 15 MB'lık dosyalar API'ye hiç ulaşmadan ham 413 ile kesilir.
  client_max_body_size 20m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

  location = /robots.txt {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location = /sitemap.xml {
    add_header Cache-Control "public, max-age=3600";
    default_type application/xml;
    try_files $uri =404;
  }

  location = /og-image.png {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://api:8080/health;
    proxy_set_header Host $host;
  }

  # Keep the document shell fresh so each deployment can reference new hashed bundles.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # Hashed Angular bundles
  location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    # Fallback nötr kabuk (index.csr.html, ~3 kB) — prerender'lı index.html
    # (~56 kB) değil. Aksi halde /plans gibi korunan bir adrese doğrudan
    # girildiğinde önce landing içeriği ve görselleri inip ekranda parlıyor,
    # ardından /api/auth/me 401 dönünce giriş ekranına geçiliyordu.
    # /, /login ve /register gerçekten prerender edildiği için (app.routes.server.ts)
    # try_files'ın önceki adımlarında yakalanır ve bundan etkilenmez.
    try_files $uri $uri/index.html $uri/ /index.csr.html;
  }
}
