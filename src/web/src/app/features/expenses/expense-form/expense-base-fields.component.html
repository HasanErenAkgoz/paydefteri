<label><span>Ad</span><input class="form-input" [ngModel]="state().name" (ngModelChange)="update('name', $event)" placeholder="Elektrik, market…" /></label>
<label><span>Tutar</span><input class="form-input" type="number" [ngModel]="state().amount" (ngModelChange)="update('amount', $event)" min="0" step="0.01" /></label>
<label><span>Ödeme tipi</span><select class="form-select" [ngModel]="state().paymentMode" (ngModelChange)="update('paymentMode', $event)"><option value="Cash">Peşin</option><option value="Installment">Taksitli</option></select></label>
@if (state().paymentMode === 'Installment') { <label><span>Taksit sayısı</span><input class="form-input" type="number" [ngModel]="state().installmentCount" (ngModelChange)="update('installmentCount', $event)" min="1" max="120" step="1" /></label> }
<label><span>Tarih</span><input class="form-input" type="date" [ngModel]="state().occurredOn" (ngModelChange)="update('occurredOn', $event)" /></label>
<label><span>Kategori</span><select class="form-select" [ngModel]="state().categoryId" (ngModelChange)="update('categoryId', $event)"><option value="">—</option>@for (category of categories(); track category.id) { <option [value]="category.id">{{ category.name }}</option> }</select></label>
<label><span>Pay</span><select class="form-select" [ngModel]="state().shareUi" (ngModelChange)="update('shareUi', $event)"><option value="Equal">Eşit böl</option><option value="Default">Varsayılan %</option><option value="sole">Tek ortak</option><option value="Custom">Özel tutarlar</option></select></label>
@if (state().shareUi === 'sole') { <label><span>Pay sahibi</span><select class="form-select" [ngModel]="state().solePartnerId" (ngModelChange)="update('solePartnerId', $event)">@for (partner of partners(); track partner.id) { <option [value]="partner.id">{{ partner.name }}</option> }</select></label> }
<label><span>Durum</span><select class="form-select" [ngModel]="state().status" (ngModelChange)="update('status', $event)"><option value="Paid">Ödendi</option><option value="Planned">Planlandı</option></select></label>
<label class="span-2"><span>Not</span><input class="form-input" [ngModel]="state().note" (ngModelChange)="update('note', $event)" /></label>
