<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Karşılama - PayDefteri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-oled: #090d16;
      --primary: #6366f1;
      --accent: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.25), transparent 70%), var(--bg-oled);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px 36px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-link {
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
    }

    .center-art {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px 0;
    }

    .art-circle {
      width: 140px;
      height: 140px;
      border-radius: 40px;
      background: linear-gradient(135deg, #4f46e5, #8b5cf6);
      display: grid;
      place-items: center;
      font-size: 4rem;
      box-shadow: 0 20px 50px rgba(99, 102, 241, 0.5), inset 0 2px 10px rgba(255, 255, 255, 0.4);
      margin-bottom: 32px;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .hero-eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #818cf8;
      margin-bottom: 8px;
    }

    .hero-headline {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .hero-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.55;
      max-width: 320px;
    }

    .bottom-actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .step-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.3s;
    }

    .dot.active {
      width: 24px;
      background: var(--primary);
    }

    .btn-start {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand-title">PayDefteri</div>
    <a href="2_login.html" class="login-link">Giriş Yap</a>
  </div>

  <div class="center-art">
    <div class="art-circle">📱</div>
    <div class="hero-eyebrow">ORTAK FİNANS ARTIK ŞEFFAF</div>
    <h1 class="hero-headline">Ortak Plan,<br>Tek Defter.</h1>
    <p class="hero-desc">Kimin ne kadar ödediği, kalan pay ve teslimat takvimi tek ekranda elinizin altında.</p>
  </div>

  <div class="bottom-actions">
    <div class="step-dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <button class="btn-start" onclick="location.href='2_login.html'">Hemen Başla →</button>
  </div>
</body>
</html>
