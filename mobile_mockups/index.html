<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PayDefteri Mobile Mockup Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-oled: #090d16;
      --bg-surface: #111827;
      --bg-card: #131b2e;
      --bg-card-subtle: rgba(19, 27, 46, 0.7);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --accent: #8b5cf6;
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.15);
      --danger: #ef4444;
      --border-color: rgba(99, 102, 241, 0.18);
      --border-focus: rgba(129, 140, 248, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #04060a;
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .hub-header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 680px;
    }

    .hub-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc, #6366f1, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .hub-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .screen-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
      max-width: 820px;
    }

    .nav-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      color: var(--text-main);
      border-color: var(--primary);
    }

    .nav-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    /* Device Mockup Frame */
    .phone-container {
      width: 390px;
      height: 844px;
      background: #000;
      border-radius: 50px;
      padding: 12px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1), 0 0 40px rgba(99, 102, 241, 0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .phone-notch {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 30px;
      background: #000;
      border-radius: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .camera-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #111;
      border: 1px solid #222;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background: var(--bg-oled);
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg-oled);
    }

    .info-strip {
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="hub-header">
    <h1 class="hub-title">PayDefteri Mobil UI/UX Mockup Galerisi</h1>
    <p class="hub-subtitle">UI/UX Pro Max tasarım ilkelerine göre hazırlanan 8 ana mobil ekran prototipi. Aşağıdaki sekmelerden ekranlar arasında geçiş yapabilirsiniz.</p>
  </div>

  <div class="screen-selector">
    <button class="nav-btn active" onclick="loadScreen('3_dashboard.html', this)">📊 1. Takip (Dashboard)</button>
    <button class="nav-btn" onclick="loadScreen('1_onboarding.html', this)">🚀 2. Karşılama (Onboarding)</button>
    <button class="nav-btn" onclick="loadScreen('2_login.html', this)">🔑 3. Giriş (Login)</button>
    <button class="nav-btn" onclick="loadScreen('7_plan_list.html', this)">📁 4. Planlarım (Plan List)</button>
    <button class="nav-btn" onclick="loadScreen('5_setup.html', this)">⚙️ 5. Kurulum (Setup)</button>
    <button class="nav-btn" onclick="loadScreen('6_data_reports.html', this)">💾 6. Yedek & Rapor (Data)</button>
    <button class="nav-btn" onclick="loadScreen('8_profile.html', this)">👤 7. Profil & Güvenlik</button>
  </div>

  <div class="phone-container">
    <div class="phone-notch">
      <div class="camera-dot"></div>
    </div>
    <div class="phone-screen">
      <iframe id="screenFrame" src="3_dashboard.html"></iframe>
    </div>
  </div>

  <div class="info-strip">
    <span>📱 OLED Koyu Tema (#090D16)</span>
    <span>⚡ 2x2 Kompakt Metrikler</span>
    <span>🖐️ 44px+ Dokunma Alanı</span>
    <span>💎 Frosted Glass Alt Menü</span>
  </div>

  <script>
    function loadScreen(url, btn) {
      document.getElementById('screenFrame').src = url;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
