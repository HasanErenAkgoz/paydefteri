<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Profil & Güvenlik - PayDefteri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-oled: #090d16;
      --bg-card: #131b2e;
      --primary: #6366f1;
      --accent: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(99, 102, 241, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-oled);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px 14px 90px;
      gap: 14px;
    }

    .profile-hero {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(19, 27, 46, 0.98));
      border: 1px solid rgba(129, 140, 248, 0.35);
      border-radius: 20px;
    }

    .user-avatar {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: grid;
      place-items: center;
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .user-info h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .user-info p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .settings-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-input {
      height: 46px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.7);
      padding: 0 14px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    .btn-save {
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .session-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .session-meta h4 {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .session-meta p {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .btn-logout-device {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-logout-main {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Fixed Bottom Bar */
    .mobile-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      height: 68px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(9, 13, 22, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      border-radius: 12px;
      cursor: pointer;
    }

    .tab-item.active {
      color: #fff;
      background: rgba(99, 102, 241, 0.22);
      box-shadow: inset 0 0 0 1px rgba(129, 140, 248, 0.35);
    }

    .tab-icon { font-size: 1.25rem; }
    .tab-label { font-size: 0.68rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="profile-hero">
    <div class="user-avatar">HE</div>
    <div class="user-info">
      <h2>Hasan Eren</h2>
      <p>hasanerenakgz@gmail.com</p>
    </div>
  </div>

  <div class="settings-card">
    <h3 class="card-title">👤 Profil Bilgileri</h3>
    <div class="form-group">
      <label class="form-label">Görünen İsim</label>
      <input type="text" class="form-input" value="Hasan Eren">
    </div>
    <button class="btn-save">Değişiklikleri Kaydet</button>
  </div>

  <div class="settings-card">
    <h3 class="card-title">📱 Aktif Mobil Cihazlar</h3>
    <div class="session-item">
      <div class="session-meta">
        <h4>Samsung Galaxy S23</h4>
        <p>Android 14 · Şu an aktif</p>
      </div>
      <span style="font-size: 0.75rem; color: #34d399; font-weight: 700;">Bu Cihaz</span>
    </div>
    <div class="session-item">
      <div class="session-meta">
        <h4>Web Tarayıcı (MacBook)</h4>
        <p>Chrome · 18 Ağu 2026</p>
      </div>
      <button class="btn-logout-device">Oturumu Kapat</button>
    </div>
  </div>

  <button class="btn-logout-main" onclick="location.href='1_onboarding.html'">🚪 Güvenli Çıkış Yap</button>

  <nav class="mobile-bottom-bar">
    <div class="tab-item" onclick="location.href='3_dashboard.html'">
      <span class="tab-icon">📊</span>
      <span class="tab-label">Takip</span>
    </div>
    <div class="tab-item" onclick="location.href='5_setup.html'">
      <span class="tab-icon">⚙️</span>
      <span class="tab-label">Kurulum</span>
    </div>
    <div class="tab-item" onclick="location.href='6_data_reports.html'">
      <span class="tab-icon">💾</span>
      <span class="tab-label">Yedek</span>
    </div>
    <div class="tab-item" onclick="location.href='7_plan_list.html'">
      <span class="tab-icon">📁</span>
      <span class="tab-label">Planlar</span>
    </div>
    <div class="tab-item active">
      <span class="tab-icon">👤</span>
      <span class="tab-label">Profil</span>
    </div>
  </nav>
</body>
</html>
