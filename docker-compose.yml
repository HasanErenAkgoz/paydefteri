services:
  postgres:
    image: postgres:16-alpine
    container_name: taksitle-db
    environment:
      POSTGRES_USER: taksitle
      POSTGRES_PASSWORD: taksitle
      POSTGRES_DB: taksitle
    ports:
      - "5432:5432"
    volumes:
      - taksitle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taksitle -d taksitle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taksitle_pgdata:
