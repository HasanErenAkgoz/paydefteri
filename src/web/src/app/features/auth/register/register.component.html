<section class="auth-stage">
  <div class="auth-stage__bg" aria-hidden="true">
    <div class="auth-stage__orb auth-stage__orb--a"></div>
    <div class="auth-stage__orb auth-stage__orb--b"></div>
    <div class="auth-stage__mesh"></div>
  </div>

  <div class="auth-layout">
    <aside class="auth-brand">
      <div class="auth-brand__mark" aria-hidden="true">
        <span></span><span></span>
      </div>
      <p class="auth-brand__name">PayDefteri</p>
      <p class="auth-brand__lead">
        Plan oluşturun, ortakları davet edin, ödemeleri birlikte takip edin.
      </p>
    </aside>

    <form class="auth-card" (ngSubmit)="submit()">
      <div class="auth-card__intro">
        <p class="auth-card__eyebrow">Yeni hesap</p>
        <h1>Kayıt ol</h1>
        <p class="auth-card__hint">Birkaç bilgiyle hesabınızı oluşturun.</p>
      </div>


      <div class="form-group">
        <label class="form-label">Görünen ad</label>
        <input
          class="form-input"
          type="text"
          name="displayName"
          [(ngModel)]="displayName"
          required
          autocomplete="name"
          placeholder="Adınız"
        />
      </div>

      <div class="form-group">
        <label class="form-label">E-posta</label>
        <input
          class="form-input"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
          placeholder="ornek@mail.com"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Şifre</label>
        <input
          class="form-input"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          autocomplete="new-password"
          placeholder="En az 6 karakter"
        />
      </div>

      <button class="btn btn-primary auth-card__submit" type="submit" [disabled]="loading()">
        {{ loading() ? 'Kaydediliyor…' : 'Hesap oluştur' }}
      </button>

      <p class="auth-footer">
        Zaten hesabınız var mı?
        <a routerLink="/login">Giriş yapın</a>
      </p>
    </form>
  </div>
</section>
