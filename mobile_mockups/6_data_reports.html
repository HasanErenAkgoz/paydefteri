<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Yedek & Raporlar - PayDefteri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-oled: #090d16;
      --bg-card: #131b2e;
      --primary: #6366f1;
      --accent: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(99, 102, 241, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-oled);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px 14px 90px;
      gap: 14px;
    }

    .page-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .hero-report-card {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(19, 27, 46, 0.98));
      border: 1px solid rgba(129, 140, 248, 0.35);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .progress-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: conic-gradient(#10b981 38.4%, rgba(148, 163, 184, 0.2) 0);
      display: grid;
      place-items: center;
      position: relative;
      flex-shrink: 0;
    }

    .progress-circle::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: var(--bg-card);
    }

    .progress-circle span {
      position: relative;
      z-index: 1;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 800;
      color: #34d399;
    }

    .report-meta h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .report-meta p {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .kpi-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .kpi-title {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .kpi-value {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .btn-export-pdf {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    }

    .btn-export-excel {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: #c7d2fe;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Fixed Bottom Bar */
    .mobile-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      height: 68px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(99, 13, 22, 0.96);
      background: rgba(9, 13, 22, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      border-radius: 12px;
      cursor: pointer;
    }

    .tab-item.active {
      color: #fff;
      background: rgba(99, 102, 241, 0.22);
      box-shadow: inset 0 0 0 1px rgba(129, 140, 248, 0.35);
    }

    .tab-icon { font-size: 1.25rem; }
    .tab-label { font-size: 0.68rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="page-title">💾 Yedekleme & Raporlar</div>

  <section class="hero-report-card">
    <div class="progress-circle">
      <span>%38</span>
    </div>
    <div class="report-meta">
      <h2>Fuzul Ev Konut Projesi</h2>
      <p>Son Güncelleme: 18 Ağustos 2026</p>
    </div>
  </section>

  <div class="kpi-grid">
    <div class="kpi-box">
      <div class="kpi-title">Toplam Maliyet</div>
      <div class="kpi-value">₺1.070.000</div>
    </div>
    <div class="kpi-box">
      <div class="kpi-title">Ödenen Pay</div>
      <div class="kpi-value" style="color: #34d399;">₺411.250</div>
    </div>
    <div class="kpi-box">
      <div class="kpi-title">Kalan Borç</div>
      <div class="kpi-value" style="color: #fbbf24;">₺658.750</div>
    </div>
    <div class="kpi-box">
      <div class="kpi-title">Ortak Sayısı</div>
      <div class="kpi-value" style="color: #818cf8;">2 Kişi</div>
    </div>
  </div>

  <button class="btn-export-pdf">🖨️ Resmi Hesaplaşma PDF'i İndir</button>
  <button class="btn-export-excel">📊 Excel / CSV Tablosu Al</button>

  <nav class="mobile-bottom-bar">
    <div class="tab-item" onclick="location.href='3_dashboard.html'">
      <span class="tab-icon">📊</span>
      <span class="tab-label">Takip</span>
    </div>
    <div class="tab-item" onclick="location.href='5_setup.html'">
      <span class="tab-icon">⚙️</span>
      <span class="tab-label">Kurulum</span>
    </div>
    <div class="tab-item active">
      <span class="tab-icon">💾</span>
      <span class="tab-label">Yedek</span>
    </div>
    <div class="tab-item" onclick="location.href='7_plan_list.html'">
      <span class="tab-icon">📁</span>
      <span class="tab-label">Planlar</span>
    </div>
    <div class="tab-item" onclick="location.href='8_profile.html'">
      <span class="tab-icon">👤</span>
      <span class="tab-label">Profil</span>
    </div>
  </nav>
</body>
</html>
