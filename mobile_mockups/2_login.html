<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Giriş Yap - PayDefteri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-oled: #090d16;
      --bg-card: #131b2e;
      --primary: #6366f1;
      --accent: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(99, 102, 241, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.2), transparent 60%), var(--bg-oled);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px 32px;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      cursor: pointer;
      text-decoration: none;
    }

    .auth-header {
      margin: 20px 0 28px;
    }

    .auth-icon-badge {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.3));
      border: 1px solid rgba(129, 140, 248, 0.4);
      display: grid;
      place-items: center;
      font-size: 1.6rem;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
    }

    .auth-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .auth-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
    }

    .form-input {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      padding: 0 16px 0 42px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .auth-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-submit {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    .btn-google {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .security-footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div>
    <div class="top-nav">
      <a href="1_onboarding.html" class="back-btn">←</a>
    </div>

    <div class="auth-header">
      <div class="auth-icon-badge">🔒</div>
      <h1 class="auth-title">Giriş Yap</h1>
      <p class="auth-sub">Planlarınıza ve ortak takip defterinize erişin.</p>
    </div>

    <form onsubmit="event.preventDefault(); location.href='3_dashboard.html'">
      <div class="form-group">
        <label class="form-label">E-posta Adresi</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input type="email" class="form-input" value="hasanerenakgz@gmail.com" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Şifre</label>
        <div class="input-wrapper">
          <span class="input-icon">🔑</span>
          <input type="password" class="form-input" value="••••••••••••" required>
        </div>
      </div>

      <div class="auth-actions">
        <button type="submit" class="btn-submit">Giriş Yap →</button>
      </div>
    </form>

    <div class="divider">veya</div>

    <button type="button" class="btn-google" onclick="location.href='3_dashboard.html'">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.9 6.3C.7 8.7 0 10.8 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/></svg>
      Google ile Giriş Yap
    </button>
  </div>

  <div class="security-footer">
    <span>🛡️ 256-bit Uçtan Uca SSL Korumalı</span>
  </div>
</body>
</html>
