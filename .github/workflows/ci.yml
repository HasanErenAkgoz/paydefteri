name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taksitle
          POSTGRES_PASSWORD: taksitle
          POSTGRES_DB: taksitle_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taksitle -d taksitle_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PayDefteri.sln

      - name: Build
        run: dotnet build PayDefteri.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test PayDefteri.sln --no-build --configuration Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (web)
        run: npm run build

      - name: Build (mobile configuration)
        run: npm run build:mobile

      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless
        env:
          CHROME_BIN: /usr/bin/google-chrome

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taksitle
          POSTGRES_PASSWORD: taksitle
          POSTGRES_DB: taksitle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taksitle -d taksitle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        working-directory: src/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: src/web
        run: npx playwright install --with-deps chromium

      # API arka planda ayağa kalkar; Playwright'ın globalSetup'ı /health'i
      # yoklayıp hazır olmadan testleri başlatmaz.
      - name: Start API
        run: |
          dotnet run --project src/api/PayDefteri.Api --urls http://localhost:5096 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5096/health >/dev/null && exit 0
            sleep 2
          done
          echo "API 120 saniyede ayağa kalkmadı" >&2
          exit 1

      - name: E2E tests
        working-directory: src/web
        run: npm run e2e
        env:
          CI: 'true'

      # Baseline'lar Playwright'ın Linux imajında üretildi (scripts/e2e-visual.sh),
      # runner da ubuntu olduğu için "-linux.png" dosyaları burada geçerli.
      - name: Görsel regresyon
        working-directory: src/web
        run: npx playwright test --grep @visual
        env:
          CI: 'true'
          E2E_VISUAL: '1'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/web/playwright-report/
          retention-days: 7
